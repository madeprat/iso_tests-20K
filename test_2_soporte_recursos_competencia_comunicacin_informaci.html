<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISO 20000 · Test 2</title><style>:root{--bg:#0b1020;--panel:#141b34;--text:#eef2ff;--muted:#b9c2e6;--ok:#1db954;--bad:#ff5d73;--accent:#6ea8fe;--accent-2:#9b7bff;--border:#2a3567;}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#0a0f1f,#101733 45%,#0d1430);color:var(--text)}.container{max-width:1100px;margin:0 auto;padding:24px}.hero{background:linear-gradient(135deg,rgba(110,168,254,.18),rgba(155,123,255,.16));border:1px solid var(--border);border-radius:22px;padding:24px}.badges{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 6px}.badge{background:#0f1733;border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:13px}h1{margin:0 0 10px;font-size:34px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.card{background:rgba(20,27,52,.92);border:1px solid var(--border);border-radius:18px;padding:18px}label{display:block;font-weight:700;margin:10px 0 6px}input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#0d1530;color:var(--text)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white}.btn-secondary{background:#202c57;color:var(--text);border:1px solid var(--border)}.quiz-shell{display:none;margin-top:22px}.question-card{background:rgba(20,27,52,.96);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px}.q-text{font-size:20px;font-weight:800;margin:8px 0 14px}.options{display:grid;gap:10px}.option{border:1px solid var(--border);background:#0f1733;border-radius:14px;padding:14px;display:flex;gap:12px;cursor:pointer}.option:hover{border-color:#4b62b0}.option input{margin-top:4px}.option.correct{border-color:rgba(29,185,84,.7);background:rgba(29,185,84,.12)}.option.wrong{border-color:rgba(255,93,115,.7);background:rgba(255,93,115,.12)}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#111936;font-size:13px}.feedback h4{margin:0 0 8px}.feedback p{margin:6px 0}.scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{background:#0f1733;border:1px solid var(--border);border-radius:16px;padding:14px}.metric .value{font-size:28px;font-weight:900}.metric .label{color:var(--muted);font-size:13px}.report{display:none}.report table{width:100%;border-collapse:collapse;font-size:14px}.report th,.report td{border:1px solid var(--border);padding:10px}.report th{background:#121b39}.pill{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.pill.ok{background:rgba(29,185,84,.16);color:#93ffc0}.pill.bad{background:rgba(255,93,115,.14);color:#ffb2bc}@media print{.hero,.card,.question-card{background:white;color:black;border:1px solid #bbb}.btn-primary,.btn-secondary,.actions{display:none}.report{display:block}.quiz-shell{display:none}}</style></head><body><div class="container"><section class="hero" id="hero"><div class="badges"><span class="badge">Test 2/5</span><span class="badge">8 preguntas</span></div><h1>ISO 20000</h1><div class="grid"><div class="card"><h2>Identificación</h2><label for="username">Usuario</label><input id="username" type="text" maxlength="80" placeholder="Nombre / Cargo" /><div class="actions"><button class="btn-primary" onclick="startQuiz()">Comenzar</button><button class="btn-secondary" onclick="window.print()">Imprimir</button></div></div><div class="card"><h3>Info</h3><div><strong>Preguntas:</strong> <span id="qCount">8</span></div></div></div></section><section id="quiz" class="quiz-shell"></section><section id="report" class="report card"><h2>Informe</h2><div class="scorebar"><div class="metric"><div class="value" id="scorePct">0%</div><div class="label">Puntuación</div></div><div class="metric"><div class="value" id="scoreHits">0</div><div class="label">Aciertos</div></div><div class="metric"><div class="value" id="scoreFails">0</div><div class="label">Errores</div></div><div class="metric"><div class="value" id="reportUser">—</div><div class="label">Usuario</div></div></div><table><thead><tr><th>#</th><th>Pregunta</th><th>Tu respuesta</th><th>Correcta</th><th>Resultado</th></tr></thead><tbody id="reportBody"></tbody></table></section></div><script>const q = [{"q":"¿Cuál de las siguientes opciones recoge mejor la información documentada clave que debe incluir el SGS?","options":["Solo el alcance, la política, los objetivos y los informes de auditoría interna.","Alcance, política y objetivos, plan de gestión de servicios, políticas de cambios y seguridad de la información, planes de continuidad, procesos, requisitos de servicio, catálogos, SLA, contratos/acuerdos con proveedores, procedimientos requeridos y registros de conformidad.","Únicamente los procedimientos exigidos por el cliente y los registros de incidencias.","Solo aquellos documentos que la organización decida conservar voluntariamente."],"correct":1,"explain":"Justificación: B es correcta porque reproduce el enfoque del apartado 7.5.4: el SGS debe incluir documentos clave como alcance, política, objetivos, plan, políticas específicas requeridas, planes de continuidad, procesos, requisitos, catálogos, SLA, contratos, acuerdos, procedimientos y registros. A es incompleta porque omite documentos esenciales de operación y relación contractual. C es incorrecta porque limita el SGS a documentos de cliente e incidencias. D es contraria a la norma porque no todo queda a discreción: hay información documentada requerida explícitamente."},{"q":"¿Qué exige la norma respecto al conocimiento necesario para el SGS?","options":["Que todo el conocimiento se documente en una base de datos formal de conocimiento.","Que solo se mantenga conocimiento técnico sobre componentes de infraestructura.","Que la organización determine y mantenga el conocimiento necesario, y que sea relevante, utilizable y esté disponible para las personas adecuadas.","Que el conocimiento sea responsabilidad exclusiva de los proveedores externos."],"correct":2,"explain":"Justificación: C es correcta porque la norma exige determinar y mantener el conocimiento necesario para apoyar el funcionamiento del SGS y de los servicios, y que ese conocimiento sea relevante, utilizable y disponible para las personas adecuadas. A es incorrecta porque la norma no exige una base de datos formal única. B es demasiado estrecha: el conocimiento no es solo técnico, también puede referirse al SGS, servicios y partes interesadas. D es incorrecta porque la organización conserva la responsabilidad sobre su SGS, aunque pueda apoyarse en terceros."},{"q":"En materia de concienciación, las personas bajo el control de la organización deben ser conscientes de:","options":["la política de gestión de servicios, los objetivos de gestión de servicios, los servicios relevantes para su trabajo, su contribución a la eficacia del SGS y las implicaciones del incumplimiento.","únicamente las sanciones aplicables por incumplir procedimientos.","solo los SLA que afecten directamente a sus tareas.","únicamente la política de seguridad de la información, si el SGS está integrado con ISO/IEC 27001."],"correct":0,"explain":"Justificación: A es correcta porque recoge los elementos de concienciación exigidos: política, objetivos, servicios relevantes, contribución a la eficacia y consecuencias del incumplimiento. B es insuficiente y punitiva: la concienciación no se limita a sanciones. C es incompleta porque los SLA no sustituyen la comprensión del SGS y de los objetivos. D es incorrecta porque la política de seguridad de la información puede ser un documento requerido, pero la concienciación de ISO/IEC 20000-1 se centra en la gestión de servicios y en el SGS."},{"q":"Las comunicaciones internas y externas pertinentes al SGS y los servicios deben determinar:","options":["solo qué comunicar y a quién comunicar.","únicamente el canal oficial de comunicación.","el contenido de comunicación, pero no el responsable, porque eso corresponde al organigrama general.","qué comunicar, cuándo comunicar, a quién comunicar, cómo comunicar y quién será responsable de la comunicación."],"correct":3,"explain":"Justificación: D es correcta porque la norma exige determinar qué se comunica, cuándo, a quién, cómo y quién es responsable. A es incompleta porque omite el momento, el método y la responsabilidad. B es incorrecta porque definir solo un canal no garantiza una comunicación planificada. C es incorrecta porque el responsable de comunicación forma parte explícita del requisito; no basta con confiar en el organigrama general si no se ha determinado."},{"q":"¿Cuál es el tratamiento correcto de la competencia en ISO/IEC 20000-1:2018?","options":["La competencia se presume si el personal tiene experiencia previa en servicios TI.","La organización debe determinar la competencia necesaria, asegurar que las personas sean competentes, tomar acciones cuando aplique, evaluar la eficacia de esas acciones y conservar evidencia documentada apropiada.","La competencia solo se exige al personal que trata incidencias graves.","La competencia se controla únicamente mediante certificados formales de formación."],"correct":1,"explain":"Justificación: B es correcta porque recoge todo el ciclo exigido: determinar competencia, asegurar competencia por educación, formación o experiencia, actuar para adquirirla cuando aplique, evaluar la eficacia de las acciones y conservar evidencia documentada. A es incorrecta porque la experiencia puede apoyar la competencia, pero no la presume automáticamente. C es incorrecta porque la competencia aplica a quienes realizan trabajos que afectan al desempeño y eficacia del SGS y de los servicios. D es incompleta porque la formación formal no es la única evidencia ni la única vía de competencia."},{"q":"El control de la información documentada debe asegurar principalmente que:","options":["toda la información esté disponible públicamente para clientes y proveedores.","los documentos se conserven indefinidamente.","la información esté disponible e idónea para su uso donde y cuando se necesite, y protegida frente a pérdida de confidencialidad, uso inadecuado o pérdida de integridad.","solo pueda existir en formato electrónico y bajo control de versiones."],"correct":2,"explain":"Justificación: C es correcta porque el control documental debe asegurar disponibilidad/idoneidad y protección adecuada. A es incorrecta porque acceso no equivale a publicación indiscriminada; puede haber permisos de consulta o modificación. B es incorrecta porque la norma exige conservación y disposición según corresponda, no conservación indefinida. D es incorrecta porque la información documentada puede estar en cualquier formato o soporte; el control de versiones es una actividad aplicable, pero no agota el control documental."},{"q":"¿Qué relación existe entre el plan de gestión de servicios y otras actividades de planificación?","options":["Otras actividades de planificación deben mantener la alineación con el plan de gestión de servicios.","El plan de gestión de servicios queda sustituido por el plan de continuidad de servicios.","El plan de gestión de servicios solo se usa durante la certificación inicial.","Las actividades de planificación pueden ignorar el plan si disponen de sus propios procedimientos."],"correct":0,"explain":"Justificación: A es correcta porque la norma exige que otras actividades de planificación mantengan la alineación con el plan de gestión de servicios. B es incorrecta porque el plan de continuidad es un documento requerido, pero no sustituye al plan del SGS. C es incorrecta porque el plan debe crearse, implementarse y mantenerse, no utilizarse solo en certificación. D es contraria a la lógica del sistema: los planes específicos deben ser coherentes con el plan de gestión de servicios."},{"q":"Al determinar y proporcionar recursos para el SGS, la organización debe considerar recursos:","options":["solo humanos y técnicos.","humanos, técnicos y financieros, pero no de información.","únicamente financieros, porque los demás se gestionan mediante procesos.","humanos, técnicos, de información y financieros necesarios para establecer, implementar, mantener y mejorar el SGS y operar los servicios."],"correct":3,"explain":"Justificación: D es correcta porque la norma menciona recursos humanos, técnicos, de información y financieros para el SGS y la operación de servicios. A es incompleta porque omite recursos de información y financieros. B es incompleta porque excluye los recursos de información, que pueden ser esenciales para conocimiento, registros, configuración y operación. C es incorrecta porque los recursos no se reducen al presupuesto; los servicios dependen de capacidades humanas, técnicas, informacionales y financieras."}]; const state = {answers: new Array(q.length).fill(null)}; function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");} function startQuiz(){renderQuiz(); document.getElementById("quiz").style.display="block"; document.getElementById("hero").style.display="none";} function renderQuiz(){const s = document.getElementById("quiz"); s.innerHTML = q.map((qu,i) => "<article class=\"question-card\"><div class=\"q-text\">" + escapeHtml(qu.q) + "</div><div class=\"options\">" + qu.options.map((o,j) => "<label class=\"option\"><input type=\"radio\" name=\"q" + i + "\" value=\"" + j + "\" onchange=\"answerQuestion(" + i + "," + j + ")\"/><span>" + escapeHtml(o) + "</span></label>").join("") + "</div><div class=\"feedback\" id=\"f" + i + "\"></div></article>").join("") + "<div class=\"actions\" style=\"margin-top:24px;justify-content:center;\"><button class=\"btn-primary\" onclick=\"submit()\">Enviar</button><button class=\"btn-secondary\" onclick=\"reset()\">Limpiar</button></div>";} function answerQuestion(i,v){state.answers[i] = v;} function submit(){const u = state.answers.map((v,i) => v === null ? i : null).filter(v => v !== null); if(u.length){alert("Contesta: " + u.map(i => i+1).join(", ")); return;} const user = document.getElementById("username").value.trim() || "Invitado"; const h = q.filter((qu,i) => qu.correct === state.answers[i]).length; const p = Math.round(h/q.length*100); q.forEach((qu,i) => {const se = state.answers[i]; const ok = se === qu.correct; document.querySelector("input[name=\"q" + i + "\"][value=\"" + se + "\"]").parentElement.classList.add(ok ? "correct" : "wrong"); document.querySelector("input[name=\"q" + i + "\"][value=\"" + qu.correct + "\"]").parentElement.classList.add("correct"); const fb = document.getElementById("f" + i); fb.className = "feedback " + (ok ? "ok" : "bad"); fb.innerHTML = "<h4>" + (ok ? "✅" : "❌") + "</h4><p><strong>Tu respuesta:</strong> " + escapeHtml(qu.options[se]) + "</p>" + (ok ? "" : "<p><strong>Correcta:</strong> " + escapeHtml(qu.options[qu.correct]) + "</p>") + (qu.explain ? "<p><strong>Justificación:</strong> " + escapeHtml(qu.explain) + "</p>" : ""); fb.style.display = "block";}); document.querySelector("#quiz .actions").innerHTML = "<button class=\"btn-primary\" onclick=\"showReport()\">Ver informe</button><button class=\"btn-secondary\" onclick=\"reset()\">Reintentar</button>"; state.score = {user, pct: p, hits: h, fails: q.length - h};} function showReport(){document.getElementById("scorePct").textContent = state.score.pct + "%"; document.getElementById("scoreHits").textContent = state.score.hits; document.getElementById("scoreFails").textContent = state.score.fails; document.getElementById("reportUser").textContent = state.score.user; document.getElementById("reportBody").innerHTML = q.map((qu,i) => {const ok = state.answers[i] === qu.correct; return "<tr><td>" + (i+1) + "</td><td>" + escapeHtml(qu.q) + "</td><td>" + escapeHtml(qu.options[state.answers[i]]) + "</td><td>" + escapeHtml(qu.options[qu.correct]) + "</td><td><span class=\"pill " + (ok ? "ok" : "bad") + "\">" + (ok ? "✓" : "✗") + "</span></td></tr>";}).join(""); document.getElementById("quiz").style.display = "none"; document.getElementById("report").style.display = "block";} function reset(){if(confirm("¿Limpiar y volver al inicio?")){state.answers = new Array(q.length).fill(null); document.getElementById("report").style.display = "none"; document.getElementById("quiz").style.display = "none"; document.getElementById("hero").style.display = "block";}}</script></body></html>
