<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISO 20000 · Test 1</title><style>:root{--bg:#0b1020;--panel:#141b34;--text:#eef2ff;--muted:#b9c2e6;--ok:#1db954;--bad:#ff5d73;--accent:#6ea8fe;--accent-2:#9b7bff;--border:#2a3567;}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#0a0f1f,#101733 45%,#0d1430);color:var(--text)}.container{max-width:1100px;margin:0 auto;padding:24px}.hero{background:linear-gradient(135deg,rgba(110,168,254,.18),rgba(155,123,255,.16));border:1px solid var(--border);border-radius:22px;padding:24px}.badges{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 6px}.badge{background:#0f1733;border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:13px}h1{margin:0 0 10px;font-size:34px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.card{background:rgba(20,27,52,.92);border:1px solid var(--border);border-radius:18px;padding:18px}label{display:block;font-weight:700;margin:10px 0 6px}input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#0d1530;color:var(--text)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white}.btn-secondary{background:#202c57;color:var(--text);border:1px solid var(--border)}.quiz-shell{display:none;margin-top:22px}.question-card{background:rgba(20,27,52,.96);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px}.q-text{font-size:20px;font-weight:800;margin:8px 0 14px}.options{display:grid;gap:10px}.option{border:1px solid var(--border);background:#0f1733;border-radius:14px;padding:14px;display:flex;gap:12px;cursor:pointer}.option:hover{border-color:#4b62b0}.option input{margin-top:4px}.option.correct{border-color:rgba(29,185,84,.7);background:rgba(29,185,84,.12)}.option.wrong{border-color:rgba(255,93,115,.7);background:rgba(255,93,115,.12)}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#111936;font-size:13px}.feedback h4{margin:0 0 8px}.feedback p{margin:6px 0}.scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{background:#0f1733;border:1px solid var(--border);border-radius:16px;padding:14px}.metric .value{font-size:28px;font-weight:900}.metric .label{color:var(--muted);font-size:13px}.report{display:none}.report table{width:100%;border-collapse:collapse;font-size:14px}.report th,.report td{border:1px solid var(--border);padding:10px}.report th{background:#121b39}.pill{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.pill.ok{background:rgba(29,185,84,.16);color:#93ffc0}.pill.bad{background:rgba(255,93,115,.14);color:#ffb2bc}@media print{.hero,.card,.question-card{background:white;color:black;border:1px solid #bbb}.btn-primary,.btn-secondary,.actions{display:none}.report{display:block}.quiz-shell{display:none}}</style></head><body><div class="container"><section class="hero" id="hero"><div class="badges"><span class="badge">Test 1/5</span><span class="badge">8 preguntas</span></div><h1>ISO 20000</h1><div class="grid"><div class="card"><h2>Identificación</h2><label for="username">Usuario</label><input id="username" type="text" maxlength="80" placeholder="Nombre / Cargo" /><div class="actions"><button class="btn-primary" onclick="startQuiz()">Comenzar</button><button class="btn-secondary" onclick="window.print()">Imprimir</button></div></div><div class="card"><h3>Info</h3><div><strong>Preguntas:</strong> <span id="qCount">8</span></div></div></div></section><section id="quiz" class="quiz-shell"></section><section id="report" class="report card"><h2>Informe</h2><div class="scorebar"><div class="metric"><div class="value" id="scorePct">0%</div><div class="label">Puntuación</div></div><div class="metric"><div class="value" id="scoreHits">0</div><div class="label">Aciertos</div></div><div class="metric"><div class="value" id="scoreFails">0</div><div class="label">Errores</div></div><div class="metric"><div class="value" id="reportUser">—</div><div class="label">Usuario</div></div></div><table><thead><tr><th>#</th><th>Pregunta</th><th>Tu respuesta</th><th>Correcta</th><th>Resultado</th></tr></thead><tbody id="reportBody"></tbody></table></section></div><script>const q = [{"q":"Una organización quiere declarar conformidad con UNE-ISO/IEC 20000-1:2018, pero excluye la gestión de proveedores porque todos los servicios del alcance se prestan internamente. ¿Cuál es la interpretación más correcta?","options":["Es aceptable excluir requisitos del capítulo 8 si no se usan proveedores externos.","No es aceptable excluir requisitos de los capítulos 4 a 10 cuando se declara conformidad, aunque algunos requisitos puedan no generar actividad práctica en un caso concreto.","Es aceptable excluir cualquier requisito si se documenta una justificación en el alcance del SGS.","Solo pueden excluirse requisitos de soporte, pero no de operación."],"correct":1,"explain":"Justificación: B es correcta porque la norma establece que no es aceptable excluir requisitos de los capítulos 4 a 10 cuando se declara conformidad. La lógica es que el SGS debe cubrir todo el sistema de gestión y el ciclo de vida de los servicios, aunque la forma de cumplir un requisito pueda variar según el contexto. A es incorrecta porque la inexistencia de proveedores externos no permite excluir el requisito; puede llevar a evidenciar que no aplica operativamente o que se gestiona con proveedores internos/clientes que actúan como proveedores, pero no a eliminarlo del SGS. C es incorrecta porque una justificación en el alcance no habilita exclusiones de los requisitos normativos. D es incorrecta porque la norma no establece esa distinción entre requisitos de soporte y operación para permitir exclusiones."},{"q":"Al definir el alcance del SGS, ¿qué debe incluir necesariamente la definición del alcance?","options":["Solo los procesos internos que soportan la prestación de servicios.","La lista completa de todos los clientes de la organización, estén o no dentro del SGS.","Los servicios incluidos dentro del alcance y el nombre de la organización que los gestiona y presta.","Únicamente las ubicaciones físicas desde las que se prestan los servicios."],"correct":2,"explain":"Justificación: C es correcta porque el alcance del SGS debe incluir los servicios dentro del alcance y el nombre de la organización que los gestiona y presta. Además, al definirlo se consideran cuestiones internas y externas, requisitos de partes interesadas y servicios entregados. A es incompleta porque el SGS no se define solo por procesos internos. B es excesiva: no exige listar todos los clientes de la organización, sino definir el alcance del SGS. D es incorrecta porque las ubicaciones pueden ser relevantes, pero no sustituyen la identificación de servicios y organización responsable."},{"q":"¿Cuál es una consecuencia correcta de la adopción de la estructura de alto nivel en la norma?","options":["La organización debe documentar su SGS siguiendo exactamente la numeración de los capítulos de la norma.","La organización debe sustituir sus términos internos por los términos usados por la norma.","La norma obliga a usar un modelo único de procesos equivalente a ITIL.","La estructura facilita la integración con otros sistemas de gestión, pero no impone una estructura documental ni terminológica interna."],"correct":3,"explain":"Justificación: D es correcta porque la estructura de alto nivel permite alinear o integrar el SGS con otros sistemas de gestión, como calidad o seguridad de la información, sin obligar a que la organización replique la estructura de capítulos ni cambie su terminología interna. A es incorrecta porque la norma aclara que su estructura no es un modelo obligatorio para documentar políticas, objetivos o procesos. B es incorrecta porque la organización puede usar términos adecuados a sus operaciones. C es incorrecta porque la norma es independiente de guías específicas y no obliga a aplicar ITIL ni ningún marco concreto."},{"q":"¿Cuál de las siguientes opciones expresa mejor una obligación específica de liderazgo en ISO/IEC 20000-1:2018 que va más allá de una formulación genérica de liderazgo?","options":["La alta dirección debe aprobar personalmente todos los cambios normales del servicio.","La alta dirección debe operar directamente el centro de servicios a usuarios.","La alta dirección debe asegurar que se determine lo que constituye valor para la organización y sus clientes, y que exista control sobre terceros involucrados en el ciclo de vida de los servicios.","La alta dirección debe definir todas las métricas operativas de cada SLA."],"correct":2,"explain":"Justificación: C es correcta porque en ISO/IEC 20000-1:2018 el liderazgo incluye asegurar que se determina el valor para la organización y sus clientes, así como el control sobre partes involucradas en el ciclo de vida de los servicios. A es incorrecta porque la norma no exige aprobación personal de la alta dirección para todos los cambios normales; exige niveles de autoridad apropiados. B es incorrecta porque la alta dirección no tiene que operar directamente servicios. D es incorrecta porque puede asegurar el marco y los recursos, pero no tiene que definir todas las métricas operativas."},{"q":"En la planificación del SGS, ¿qué debe documentar la organización en relación con riesgos y oportunidades?","options":["Únicamente los riesgos financieros derivados de la prestación de servicios.","Los riesgos relacionados con la organización, el incumplimiento de requisitos de servicio y la involucración de otras partes; su impacto en clientes y oportunidades; los criterios de aceptación de riesgos y el enfoque de gestión de riesgos.","Solo una matriz de riesgos de seguridad de la información, siempre que exista un SGSI certificado.","Los riesgos que decida tratar, pero no los criterios de aceptación, porque estos pertenecen a la alta dirección."],"correct":1,"explain":"Justificación: B es correcta porque recoge los elementos específicos de 6.1: riesgos relacionados con la organización, incumplimiento de requisitos de servicio e involucración de otras partes; impacto en clientes y oportunidades; criterios de aceptación y enfoque de gestión de riesgos. A es incorrecta porque reduce indebidamente los riesgos a lo financiero. C es incorrecta porque la norma trata la gestión de servicios, no solo la seguridad de la información; aunque pueda integrarse con un SGSI, no se sustituye el requisito. D es incorrecta porque los criterios de aceptación sí deben determinarse y documentarse."},{"q":"Respecto a los objetivos de gestión de servicios, ¿cuál es la afirmación correcta?","options":["Deben ser coherentes con la política de gestión de servicios, medibles, monitorizados, comunicados y actualizados cuando corresponda.","Deben ser medibles solo si es posible, porque la norma no exige medición cuando el objetivo sea cualitativo.","Solo deben establecerse a nivel estratégico, no en funciones o niveles relevantes.","No requieren información documentada si se integran en el plan de gestión de servicios."],"correct":0,"explain":"Justificación: A es correcta porque los objetivos de gestión de servicios deben ser coherentes con la política, medibles, tener en cuenta requisitos aplicables, ser monitorizados, comunicados y actualizados según corresponda, además de conservarse como información documentada. B es incorrecta porque en esta norma los objetivos deben ser medibles; no usa aquí la fórmula “si es posible”. C es incorrecta porque deben establecerse en funciones y niveles relevantes. D es incorrecta porque la norma exige conservar información documentada sobre los objetivos, aunque estén relacionados con el plan de gestión de servicios."},{"q":"¿Cuál de los siguientes contenidos forma parte del plan de gestión de servicios?","options":["Exclusivamente el calendario anual de auditorías y revisiones por la dirección.","Únicamente el catálogo de servicios y los SLA aplicables.","La lista de servicios, limitaciones conocidas, obligaciones aplicables, autoridades y responsabilidades, recursos necesarios, enfoque con otras partes, tecnología de soporte y cómo se medirá, auditará, informará y mejorará el SGS y los servicios.","Solo las acciones correctivas abiertas y las oportunidades de mejora pendientes."],"correct":2,"explain":"Justificación: C es correcta porque sintetiza los contenidos que el plan de gestión de servicios debe incluir o referenciar: servicios, limitaciones, obligaciones, autoridades, responsabilidades, recursos, enfoque con otras partes, tecnología de soporte y métodos para medir, auditar, informar y mejorar. A es incorrecta porque auditorías y revisiones son solo una parte del gobierno del SGS. B es incompleta: catálogo y SLA son documentos clave, pero no agotan el plan. D es incorrecta porque acciones correctivas y mejoras son relevantes, pero el plan tiene una función más amplia de planificación del SGS y de los servicios."},{"q":"La política de gestión de servicios debe:","options":["incluir el detalle de todos los procedimientos operativos del SGS.","ser apropiada al propósito de la organización, proporcionar marco para los objetivos, comprometer el cumplimiento de requisitos aplicables y la mejora continua del SGS y los servicios.","limitarse a expresar la intención de cumplir los SLA acordados con clientes.","estar disponible únicamente para el personal interno, sin posibilidad de disponibilidad a otras partes interesadas."],"correct":1,"explain":"Justificación: B es correcta porque la política debe ser apropiada al propósito de la organización, servir de marco para objetivos, comprometer el cumplimiento de requisitos aplicables y la mejora continua del SGS y los servicios. A es incorrecta porque la política no es un manual operativo completo. C es incompleta porque la gestión de servicios no se reduce a cumplir SLA; también hay SGS, requisitos aplicables, valor, mejora y servicios. D es incorrecta porque la política debe comunicarse dentro de la organización y estar disponible para partes interesadas según corresponda."}]; const state = {answers: new Array(q.length).fill(null)}; function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");} function startQuiz(){renderQuiz(); document.getElementById("quiz").style.display="block"; document.getElementById("hero").style.display="none";} function renderQuiz(){const s = document.getElementById("quiz"); s.innerHTML = q.map((qu,i) => "<article class=\"question-card\"><div class=\"q-text\">" + escapeHtml(qu.q) + "</div><div class=\"options\">" + qu.options.map((o,j) => "<label class=\"option\"><input type=\"radio\" name=\"q" + i + "\" value=\"" + j + "\" onchange=\"answerQuestion(" + i + "," + j + ")\"/><span>" + escapeHtml(o) + "</span></label>").join("") + "</div><div class=\"feedback\" id=\"f" + i + "\"></div></article>").join("") + "<div class=\"actions\" style=\"margin-top:24px;justify-content:center;\"><button class=\"btn-primary\" onclick=\"submit()\">Enviar</button><button class=\"btn-secondary\" onclick=\"reset()\">Limpiar</button></div>";} function answerQuestion(i,v){state.answers[i] = v;} function submit(){const u = state.answers.map((v,i) => v === null ? i : null).filter(v => v !== null); if(u.length){alert("Contesta: " + u.map(i => i+1).join(", ")); return;} const user = document.getElementById("username").value.trim() || "Invitado"; const h = q.filter((qu,i) => qu.correct === state.answers[i]).length; const p = Math.round(h/q.length*100); q.forEach((qu,i) => {const se = state.answers[i]; const ok = se === qu.correct; document.querySelector("input[name=\"q" + i + "\"][value=\"" + se + "\"]").parentElement.classList.add(ok ? "correct" : "wrong"); document.querySelector("input[name=\"q" + i + "\"][value=\"" + qu.correct + "\"]").parentElement.classList.add("correct"); const fb = document.getElementById("f" + i); fb.className = "feedback " + (ok ? "ok" : "bad"); fb.innerHTML = "<h4>" + (ok ? "✅" : "❌") + "</h4><p><strong>Tu respuesta:</strong> " + escapeHtml(qu.options[se]) + "</p>" + (ok ? "" : "<p><strong>Correcta:</strong> " + escapeHtml(qu.options[qu.correct]) + "</p>") + (qu.explain ? "<p><strong>Justificación:</strong> " + escapeHtml(qu.explain) + "</p>" : ""); fb.style.display = "block";}); document.querySelector("#quiz .actions").innerHTML = "<button class=\"btn-primary\" onclick=\"showReport()\">Ver informe</button><button class=\"btn-secondary\" onclick=\"reset()\">Reintentar</button>"; state.score = {user, pct: p, hits: h, fails: q.length - h};} function showReport(){document.getElementById("scorePct").textContent = state.score.pct + "%"; document.getElementById("scoreHits").textContent = state.score.hits; document.getElementById("scoreFails").textContent = state.score.fails; document.getElementById("reportUser").textContent = state.score.user; document.getElementById("reportBody").innerHTML = q.map((qu,i) => {const ok = state.answers[i] === qu.correct; return "<tr><td>" + (i+1) + "</td><td>" + escapeHtml(qu.q) + "</td><td>" + escapeHtml(qu.options[state.answers[i]]) + "</td><td>" + escapeHtml(qu.options[qu.correct]) + "</td><td><span class=\"pill " + (ok ? "ok" : "bad") + "\">" + (ok ? "✓" : "✗") + "</span></td></tr>";}).join(""); document.getElementById("quiz").style.display = "none"; document.getElementById("report").style.display = "block";} function reset(){if(confirm("¿Limpiar y volver al inicio?")){state.answers = new Array(q.length).fill(null); document.getElementById("report").style.display = "none"; document.getElementById("quiz").style.display = "none"; document.getElementById("hero").style.display = "block";}}</script></body></html>
