<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISO 20000 · Test 5</title><style>:root{--bg:#0b1020;--panel:#141b34;--text:#eef2ff;--muted:#b9c2e6;--ok:#1db954;--bad:#ff5d73;--accent:#6ea8fe;--accent-2:#9b7bff;--border:#2a3567;}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#0a0f1f,#101733 45%,#0d1430);color:var(--text)}.container{max-width:1100px;margin:0 auto;padding:24px}.hero{background:linear-gradient(135deg,rgba(110,168,254,.18),rgba(155,123,255,.16));border:1px solid var(--border);border-radius:22px;padding:24px}.badges{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 6px}.badge{background:#0f1733;border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:13px}h1{margin:0 0 10px;font-size:34px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.card{background:rgba(20,27,52,.92);border:1px solid var(--border);border-radius:18px;padding:18px}label{display:block;font-weight:700;margin:10px 0 6px}input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#0d1530;color:var(--text)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white}.btn-secondary{background:#202c57;color:var(--text);border:1px solid var(--border)}.quiz-shell{display:none;margin-top:22px}.question-card{background:rgba(20,27,52,.96);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px}.q-text{font-size:20px;font-weight:800;margin:8px 0 14px}.options{display:grid;gap:10px}.option{border:1px solid var(--border);background:#0f1733;border-radius:14px;padding:14px;display:flex;gap:12px;cursor:pointer}.option:hover{border-color:#4b62b0}.option input{margin-top:4px}.option.correct{border-color:rgba(29,185,84,.7);background:rgba(29,185,84,.12)}.option.wrong{border-color:rgba(255,93,115,.7);background:rgba(255,93,115,.12)}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#111936;font-size:13px}.feedback h4{margin:0 0 8px}.feedback p{margin:6px 0}.scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{background:#0f1733;border:1px solid var(--border);border-radius:16px;padding:14px}.metric .value{font-size:28px;font-weight:900}.metric .label{color:var(--muted);font-size:13px}.report{display:none}.report table{width:100%;border-collapse:collapse;font-size:14px}.report th,.report td{border:1px solid var(--border);padding:10px}.report th{background:#121b39}.pill{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.pill.ok{background:rgba(29,185,84,.16);color:#93ffc0}.pill.bad{background:rgba(255,93,115,.14);color:#ffb2bc}@media print{.hero,.card,.question-card{background:white;color:black;border:1px solid #bbb}.btn-primary,.btn-secondary,.actions{display:none}.report{display:block}.quiz-shell{display:none}}</style></head><body><div class="container"><section class="hero" id="hero"><div class="badges"><span class="badge">Test 5/5</span><span class="badge">8 preguntas</span></div><h1>ISO 20000</h1><div class="grid"><div class="card"><h2>Identificación</h2><label for="username">Usuario</label><input id="username" type="text" maxlength="80" placeholder="Nombre / Cargo" /><div class="actions"><button class="btn-primary" onclick="startQuiz()">Comenzar</button><button class="btn-secondary" onclick="window.print()">Imprimir</button></div></div><div class="card"><h3>Info</h3><div><strong>Preguntas:</strong> <span id="qCount">8</span></div></div></div></section><section id="quiz" class="quiz-shell"></section><section id="report" class="report card"><h2>Informe</h2><div class="scorebar"><div class="metric"><div class="value" id="scorePct">0%</div><div class="label">Puntuación</div></div><div class="metric"><div class="value" id="scoreHits">0</div><div class="label">Aciertos</div></div><div class="metric"><div class="value" id="scoreFails">0</div><div class="label">Errores</div></div><div class="metric"><div class="value" id="reportUser">—</div><div class="label">Usuario</div></div></div><table><thead><tr><th>#</th><th>Pregunta</th><th>Tu respuesta</th><th>Correcta</th><th>Resultado</th></tr></thead><tbody id="reportBody"></tbody></table></section></div><script>const q = [{"q":"En la planificación de servicios nuevos o modificados dentro de diseño y transición, ¿qué debe incluirse o referenciarse?","options":["Solo el nombre del servicio, el propietario y la fecha prevista de puesta en producción.","Autoridades y responsabilidades, actividades y plazos, recursos, dependencias, pruebas, criterios de aceptación, resultados esperados medibles e impacto en el SGS, otros servicios, cambios, clientes, usuarios y partes interesadas; además de actividades específicas si hay retirada o transferencia.","Únicamente los requisitos técnicos de infraestructura.","Solo los cambios que afecten a proveedores externos."],"correct":1,"explain":"Justificación: B es correcta porque la planificación de servicios nuevos o modificados debe incluir o referenciar responsabilidades, actividades, plazos, recursos, dependencias, pruebas, criterios de aceptación, resultados esperados medibles e impactos. Además, para retiradas o transferencias debe contemplar fechas y actividades sobre datos, información documentada, conocimiento y componentes de servicio según proceda. A es muy incompleta. C reduce indebidamente el diseño y transición a infraestructura. D es incorrecta porque el diseño y transición aplica a servicios nuevos o modificados relevantes, no solo a cambios con proveedores externos."},{"q":"En gestión de entregas y despliegues, ¿cuál es la afirmación correcta?","options":["Las entregas se despliegan primero y se verifican después contra criterios de aceptación.","La línea base de configuración se captura después del despliegue si aparecen incidencias.","El despliegue debe planificarse coordinado con gestión de cambios, incluir referencias a RFC, errores conocidos o problemas relacionados, verificarse antes del despliegue, capturar línea base de CI afectados y monitorizar éxito o fallo.","Las entregas de emergencia quedan fuera de la gestión de entregas."],"correct":2,"explain":"Justificación: C es correcta porque las entregas se planifican coordinadas con cambios, deben referenciar RFC, errores conocidos o problemas resueltos por la entrega, verificarse contra criterios de aceptación antes del despliegue, capturar línea base de configuración de CI afectados y monitorizar éxito o fallo, incluyendo incidencias posteriores al despliegue. A es incorrecta porque la verificación debe ocurrir antes del despliegue. B es incorrecta porque la línea base se captura antes del despliegue. D es falsa porque la norma incluye la entrega de emergencia como tipo de entrega a definir."},{"q":"En gestión de incidencias, las incidencias deben:","options":["registrarse y clasificarse, priorizarse considerando impacto y urgencia, escalarse si es necesario, resolverse y cerrarse.","registrarse solo cuando afecten a un SLA.","clasificarse únicamente después de su resolución.","tratarse igual que las peticiones de servicio, sin considerar impacto ni urgencia."],"correct":0,"explain":"Justificación: A es correcta porque reproduce el flujo requerido para incidencias: registro, clasificación, priorización por impacto y urgencia, escalado si procede, resolución y cierre. B es incorrecta porque una incidencia puede ser relevante aunque aún no haya incumplido un SLA. C es incorrecta porque la clasificación es necesaria para gestionar adecuadamente desde el inicio. D es falsa porque las peticiones de servicio tienen un tratamiento propio y la priorización de incidencias considera impacto y urgencia."},{"q":"¿Qué exige la norma para las incidencias graves?","options":["Que siempre sean aprobadas por el cliente antes de resolverse.","Que se traten como problemas desde el primer momento.","Que se cierren automáticamente tras restaurar el servicio.","Que existan criterios para identificarlas, se clasifiquen y gestionen según procedimiento documentado, se mantenga informada a la alta dirección, se asigne responsabilidad y se revisen formalmente tras su resolución para identificar mejoras."],"correct":3,"explain":"Justificación: D es correcta porque la norma exige criterios de identificación de incidencias graves, procedimiento documentado, información a alta dirección, asignación de responsabilidad y revisión formal posterior para mejoras. A es incorrecta porque la resolución no depende siempre de aprobación previa del cliente. B es incorrecta porque una incidencia grave no se convierte automáticamente en problema, aunque pueda originar análisis posterior. C es incorrecta porque restaurar el servicio no agota el requisito: debe revisarse formalmente para identificar oportunidades de mejora."},{"q":"¿Cuál es la interpretación correcta de la gestión de problemas?","options":["Un problema solo existe si ya se conoce su causa raíz.","La organización debe analizar datos y tendencias de incidencias para identificar problemas, hacer análisis de causa raíz, determinar acciones para prevenir ocurrencia o repetición, registrar errores conocidos cuando la causa se conoce pero no hay resolución definitiva, y gestionar cambios necesarios conforme a la política de cambios.","La gestión de problemas se limita a resolver incidencias graves.","Los errores conocidos no deben comunicarse a otras actividades de gestión para evitar confusión."],"correct":1,"explain":"Justificación: B es correcta porque la gestión de problemas no es solo reacción a incidencias individuales: analiza datos y tendencias, identifica problemas, realiza análisis de causa raíz, determina acciones preventivas, registra problemas y errores conocidos, y coordina cambios necesarios con la gestión de cambios. A es incorrecta porque el problema puede existir como causa de incidencias reales o potenciales aunque la causa raíz no esté identificada aún. C es demasiado limitada. D es contraria a la norma, que exige poner información actualizada sobre errores conocidos y resoluciones a disposición de otras actividades según corresponda."},{"q":"¿Cuál es la diferencia clave entre disponibilidad de servicios y continuidad de servicios?","options":["Disponibilidad y continuidad son sinónimos y la norma los trata como un único proceso.","La disponibilidad solo aplica a infraestructura; la continuidad solo a personas.","La disponibilidad se centra en que el servicio realice la función requerida en momentos o periodos acordados; la continuidad se centra en la capacidad de entregar el servicio sin interrupción o con disponibilidad constante según lo acordado, incluyendo planes de continuidad, pruebas y recuperación.","La continuidad solo se documenta cuando se ha invocado un plan."],"correct":2,"explain":"Justificación: C es correcta porque distingue disponibilidad de servicio —capacidad de realizar la función requerida en momentos o periodos acordados— y continuidad —capacidad de seguir entregando el servicio sin interrupción o con disponibilidad constante, apoyada por planes, pruebas, recuperación y retorno a condiciones normales—. A es incorrecta porque la norma los separa en apartados distintos. B es falsa porque ambos pueden implicar personas, tecnología, información y procesos. D es incorrecta porque la continuidad se planifica, documenta y prueba antes de su invocación."},{"q":"En gestión de la seguridad de la información dentro de ISO/IEC 20000-1, ¿qué debe hacer la organización?","options":["Aprobar y documentar una política de seguridad relevante, comunicar su importancia a las partes apropiadas, evaluar y documentar riesgos de seguridad del SGS y servicios a intervalos planificados, determinar e implementar controles, documentar decisiones sobre controles y gestionar incidencias de seguridad.","Limitarse a tener un certificado ISO/IEC 27001 vigente.","Gestionar únicamente incidencias de seguridad que afecten a datos personales.","Delegar la seguridad de la información al proveedor externo de infraestructura."],"correct":0,"explain":"Justificación: A es correcta porque la norma exige política de seguridad de la información aprobada por autoridad adecuada, documentada y comunicada; evaluación documentada de riesgos de seguridad para SGS y servicios a intervalos planificados; controles determinados, implementados y operados; decisiones documentadas; y gestión de incidencias de seguridad. B es incorrecta porque un certificado ISO/IEC 27001 puede ayudar, pero no sustituye automáticamente la evidencia de cumplimiento dentro del SGS. C es demasiado estrecha. D es incorrecta porque la organización mantiene responsabilidad aunque participen proveedores."},{"q":"¿Cuál de las siguientes opciones refleja mejor la relación entre evaluación del desempeño, informes de servicio y mejora?","options":["La evaluación del desempeño se limita a auditorías internas, y los informes de servicio son opcionales.","Los informes de servicio sustituyen a la revisión por la dirección.","La mejora continua se activa solo cuando hay una no conformidad mayor.","La organización debe monitorizar, medir, analizar y evaluar el SGS y servicios; auditar internamente; revisar por la dirección; generar informes de rendimiento y eficacia con tendencias; decidir acciones basadas en conclusiones; gestionar no conformidades y mejorar continuamente la conveniencia, adecuación y eficacia del SGS y los servicios."],"correct":3,"explain":"Justificación: D es correcta porque integra los requisitos de los capítulos 9 y 10: seguimiento, medición, análisis, evaluación, auditoría interna, revisión por dirección, informes con tendencias, acciones basadas en conclusiones, no conformidad/acción correctiva y mejora continua del SGS y servicios. A es incorrecta porque la evaluación del desempeño incluye mucho más que auditorías y los informes de servicio sí son requisito. B es incorrecta porque los informes alimentan decisiones, pero no sustituyen la revisión por la dirección. C es incorrecta porque la mejora continua también incluye oportunidades proactivas, no solo no conformidades mayores."}]; const state = {answers: new Array(q.length).fill(null)}; function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");} function startQuiz(){renderQuiz(); document.getElementById("quiz").style.display="block"; document.getElementById("hero").style.display="none";} function renderQuiz(){const s = document.getElementById("quiz"); s.innerHTML = q.map((qu,i) => "<article class=\"question-card\"><div class=\"q-text\">" + escapeHtml(qu.q) + "</div><div class=\"options\">" + qu.options.map((o,j) => "<label class=\"option\"><input type=\"radio\" name=\"q" + i + "\" value=\"" + j + "\" onchange=\"answerQuestion(" + i + "," + j + ")\"/><span>" + escapeHtml(o) + "</span></label>").join("") + "</div><div class=\"feedback\" id=\"f" + i + "\"></div></article>").join("") + "<div class=\"actions\" style=\"margin-top:24px;justify-content:center;\"><button class=\"btn-primary\" onclick=\"submit()\">Enviar</button><button class=\"btn-secondary\" onclick=\"reset()\">Limpiar</button></div>";} function answerQuestion(i,v){state.answers[i] = v;} function submit(){const u = state.answers.map((v,i) => v === null ? i : null).filter(v => v !== null); if(u.length){alert("Contesta: " + u.map(i => i+1).join(", ")); return;} const user = document.getElementById("username").value.trim() || "Invitado"; const h = q.filter((qu,i) => qu.correct === state.answers[i]).length; const p = Math.round(h/q.length*100); q.forEach((qu,i) => {const se = state.answers[i]; const ok = se === qu.correct; document.querySelector("input[name=\"q" + i + "\"][value=\"" + se + "\"]").parentElement.classList.add(ok ? "correct" : "wrong"); document.querySelector("input[name=\"q" + i + "\"][value=\"" + qu.correct + "\"]").parentElement.classList.add("correct"); const fb = document.getElementById("f" + i); fb.className = "feedback " + (ok ? "ok" : "bad"); fb.innerHTML = "<h4>" + (ok ? "✅" : "❌") + "</h4><p><strong>Tu respuesta:</strong> " + escapeHtml(qu.options[se]) + "</p>" + (ok ? "" : "<p><strong>Correcta:</strong> " + escapeHtml(qu.options[qu.correct]) + "</p>") + (qu.explain ? "<p><strong>Justificación:</strong> " + escapeHtml(qu.explain) + "</p>" : ""); fb.style.display = "block";}); document.querySelector("#quiz .actions").innerHTML = "<button class=\"btn-primary\" onclick=\"showReport()\">Ver informe</button><button class=\"btn-secondary\" onclick=\"reset()\">Reintentar</button>"; state.score = {user, pct: p, hits: h, fails: q.length - h};} function showReport(){document.getElementById("scorePct").textContent = state.score.pct + "%"; document.getElementById("scoreHits").textContent = state.score.hits; document.getElementById("scoreFails").textContent = state.score.fails; document.getElementById("reportUser").textContent = state.score.user; document.getElementById("reportBody").innerHTML = q.map((qu,i) => {const ok = state.answers[i] === qu.correct; return "<tr><td>" + (i+1) + "</td><td>" + escapeHtml(qu.q) + "</td><td>" + escapeHtml(qu.options[state.answers[i]]) + "</td><td>" + escapeHtml(qu.options[qu.correct]) + "</td><td><span class=\"pill " + (ok ? "ok" : "bad") + "\">" + (ok ? "✓" : "✗") + "</span></td></tr>";}).join(""); document.getElementById("quiz").style.display = "none"; document.getElementById("report").style.display = "block";} function reset(){if(confirm("¿Limpiar y volver al inicio?")){state.answers = new Array(q.length).fill(null); document.getElementById("report").style.display = "none"; document.getElementById("quiz").style.display = "none"; document.getElementById("hero").style.display = "block";}}</script></body></html>
