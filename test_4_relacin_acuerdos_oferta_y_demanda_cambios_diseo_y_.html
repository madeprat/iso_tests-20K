<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISO 20000 · Test 4</title><style>:root{--bg:#0b1020;--panel:#141b34;--text:#eef2ff;--muted:#b9c2e6;--ok:#1db954;--bad:#ff5d73;--accent:#6ea8fe;--accent-2:#9b7bff;--border:#2a3567;}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#0a0f1f,#101733 45%,#0d1430);color:var(--text)}.container{max-width:1100px;margin:0 auto;padding:24px}.hero{background:linear-gradient(135deg,rgba(110,168,254,.18),rgba(155,123,255,.16));border:1px solid var(--border);border-radius:22px;padding:24px}.badges{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 6px}.badge{background:#0f1733;border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:13px}h1{margin:0 0 10px;font-size:34px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.card{background:rgba(20,27,52,.92);border:1px solid var(--border);border-radius:18px;padding:18px}label{display:block;font-weight:700;margin:10px 0 6px}input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#0d1530;color:var(--text)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white}.btn-secondary{background:#202c57;color:var(--text);border:1px solid var(--border)}.quiz-shell{display:none;margin-top:22px}.question-card{background:rgba(20,27,52,.96);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px}.q-text{font-size:20px;font-weight:800;margin:8px 0 14px}.options{display:grid;gap:10px}.option{border:1px solid var(--border);background:#0f1733;border-radius:14px;padding:14px;display:flex;gap:12px;cursor:pointer}.option:hover{border-color:#4b62b0}.option input{margin-top:4px}.option.correct{border-color:rgba(29,185,84,.7);background:rgba(29,185,84,.12)}.option.wrong{border-color:rgba(255,93,115,.7);background:rgba(255,93,115,.12)}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#111936;font-size:13px}.feedback h4{margin:0 0 8px}.feedback p{margin:6px 0}.scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{background:#0f1733;border:1px solid var(--border);border-radius:16px;padding:14px}.metric .value{font-size:28px;font-weight:900}.metric .label{color:var(--muted);font-size:13px}.report{display:none}.report table{width:100%;border-collapse:collapse;font-size:14px}.report th,.report td{border:1px solid var(--border);padding:10px}.report th{background:#121b39}.pill{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.pill.ok{background:rgba(29,185,84,.16);color:#93ffc0}.pill.bad{background:rgba(255,93,115,.14);color:#ffb2bc}@media print{.hero,.card,.question-card{background:white;color:black;border:1px solid #bbb}.btn-primary,.btn-secondary,.actions{display:none}.report{display:block}.quiz-shell{display:none}}</style></head><body><div class="container"><section class="hero" id="hero"><div class="badges"><span class="badge">Test 4/5</span><span class="badge">8 preguntas</span></div><h1>ISO 20000</h1><div class="grid"><div class="card"><h2>Identificación</h2><label for="username">Usuario</label><input id="username" type="text" maxlength="80" placeholder="Nombre / Cargo" /><div class="actions"><button class="btn-primary" onclick="startQuiz()">Comenzar</button><button class="btn-secondary" onclick="window.print()">Imprimir</button></div></div><div class="card"><h3>Info</h3><div><strong>Preguntas:</strong> <span id="qCount">8</span></div></div></div></section><section id="quiz" class="quiz-shell"></section><section id="report" class="report card"><h2>Informe</h2><div class="scorebar"><div class="metric"><div class="value" id="scorePct">0%</div><div class="label">Puntuación</div></div><div class="metric"><div class="value" id="scoreHits">0</div><div class="label">Aciertos</div></div><div class="metric"><div class="value" id="scoreFails">0</div><div class="label">Errores</div></div><div class="metric"><div class="value" id="reportUser">—</div><div class="label">Usuario</div></div></div><table><thead><tr><th>#</th><th>Pregunta</th><th>Tu respuesta</th><th>Correcta</th><th>Resultado</th></tr></thead><tbody id="reportBody"></tbody></table></section></div><script>const q = [{"q":"En la gestión de relaciones con el negocio, ¿cuál es la combinación correcta de requisitos?","options":["Identificar únicamente clientes contractuales y medir satisfacción solo si existe reclamación.","Designar responsables de relación, pero sin necesidad de documentar usuarios u otras partes interesadas.","Gestionar solo reclamaciones escaladas, no reclamaciones resueltas por canales normales.","Identificar y documentar clientes, usuarios y otras partes interesadas; designar responsables de relaciones y satisfacción; establecer comunicaciones; revisar tendencias; medir satisfacción con muestra representativa; y gestionar reclamaciones hasta cierre."],"correct":3,"explain":"Justificación: D es correcta porque integra los requisitos de relación con el negocio: identificación documental de clientes, usuarios y partes interesadas; responsables designados; acuerdos de comunicación; revisión de tendencias; medición periódica de satisfacción con muestra representativa; análisis, comunicación y gestión de reclamaciones hasta cierre con escalado si procede. A es incompleta porque no cubre usuarios, partes interesadas ni medición planificada. B es incorrecta porque sí se exige identificar y documentar clientes, usuarios y partes interesadas. C es incorrecta porque todas las reclamaciones de servicios deben registrarse, gestionarse hasta cierre y comunicarse."},{"q":"Para cada servicio prestado, los SLA deben:","options":["sustituir a los requisitos de servicio documentados.","basarse en los requisitos de servicio documentados e incluir objetivos de nivel de servicio, límites de volumen de trabajo y excepciones.","incluir solo penalizaciones por incumplimiento.","ser revisados únicamente cuando el cliente lo solicite formalmente."],"correct":1,"explain":"Justificación: B es correcta porque los SLA se establecen para cada servicio prestado sobre la base de requisitos de servicio documentados, e incluyen objetivos de nivel de servicio, límites de volumen de trabajo y excepciones. A es incorrecta porque los SLA no sustituyen los requisitos: se basan en ellos. C es reduccionista; las penalizaciones no son el núcleo del requisito. D es incorrecta porque la organización debe monitorizar, revisar e informar a intervalos planificados el desempeño frente a objetivos y volúmenes frente a límites."},{"q":"En la gestión de proveedores externos, ¿qué debe incluir o referenciar el contrato documentado?","options":["Alcance de servicios/componentes/procesos, requisitos del proveedor, objetivos de nivel de servicio u otras obligaciones contractuales, y autoridades y responsabilidades de la organización y del proveedor externo.","Únicamente precio, plazo y penalizaciones.","Solo los requisitos legales y financieros del proveedor.","La totalidad de los procedimientos internos del proveedor, sin necesidad de objetivos de nivel de servicio."],"correct":0,"explain":"Justificación: A es correcta porque el contrato con proveedor externo debe incluir o referenciar el alcance, requisitos, objetivos de nivel de servicio u obligaciones contractuales y autoridades/responsabilidades. B es incompleta y contractualista en exceso: precio y penalización no bastan para controlar el servicio. C es insuficiente porque no aborda alcance operativo ni desempeño. D es incorrecta porque no es necesario incorporar todos los procedimientos internos del proveedor y sí son necesarios objetivos u obligaciones que permitan control."},{"q":"Para proveedores internos o clientes que actúan como proveedores, la organización debe:","options":["aplicar siempre contratos mercantiles idénticos a los de proveedores externos.","excluirlos de la gestión de proveedores porque pertenecen al entorno interno o al cliente.","monitorizarlos solo si prestan servicios directamente al usuario final.","desarrollar, acordar y mantener un acuerdo documentado que defina objetivos de nivel de servicio, otros compromisos, actividades e interfaces entre las partes, y monitorizar su desempeño a intervalos planificados."],"correct":3,"explain":"Justificación: D es correcta porque la norma exige acuerdos documentados con proveedores internos o clientes que actúan como proveedores, definiendo objetivos, compromisos, actividades e interfaces, además de monitorizar su desempeño. A es incorrecta porque no exige contratos mercantiles idénticos; habla de acuerdos documentados. B es falsa porque estos actores sí forman parte de las partes que pueden contribuir al ciclo de vida. C es incompleta porque el desempeño debe monitorizarse por su contribución al SGS y servicios, no solo cuando atienden directamente al usuario final."},{"q":"Sobre presupuesto y contabilidad de servicios, ¿cuál es la afirmación correcta?","options":["La norma exige facturar internamente todos los servicios.","La norma no exige presupuestar costes si los servicios no se cobran al cliente.","La organización debe presupuestar y contabilizar servicios o grupos de servicios, monitorizar costes reales frente al presupuesto, revisar previsiones y gestionar costes; el cobro queda fuera del requisito.","La contabilidad de servicios solo aplica a proveedores externos."],"correct":2,"explain":"Justificación: C es correcta porque la norma exige presupuestar y contabilizar servicios o grupos de servicios, monitorizar costes reales frente a presupuesto, revisar previsiones y gestionar costes. También aclara que el cobro queda excluido para mantener aplicabilidad a organizaciones que no facturan servicios. A es incorrecta porque no se exige facturación interna. B es incorrecta porque no cobrar no elimina el requisito de presupuestar y controlar costes. D es falsa porque aplica a servicios del SGS, no solo a proveedores externos."},{"q":"¿Cuál es la relación correcta entre gestión de demanda y gestión de capacidad?","options":["La demanda se gestiona solo mediante el catálogo, mientras la capacidad se gestiona solo mediante incidencias.","La demanda determina demanda actual y futura y monitoriza consumo; la capacidad utiliza esa información para planificar y proporcionar capacidad suficiente para cumplir requisitos de capacidad y rendimiento.","La capacidad solo se planifica cuando se incumple un SLA.","La demanda y la capacidad son requisitos alternativos: basta con implementar uno de ellos."],"correct":1,"explain":"Justificación: B es correcta porque la demanda consiste en determinar demanda actual y futura y monitorizar consumo; la capacidad debe planificarse considerando demanda actual y prevista, objetivos de nivel de servicio, disponibilidad, continuidad y umbrales. A es incorrecta porque confunde los procesos y los reduce indebidamente. C es incorrecta porque la capacidad se planifica de forma preventiva, no solo reactiva ante incumplimientos. D es contraria al sistema: demanda y capacidad son actividades complementarias, no alternativas."},{"q":"La política de gestión de cambios debe definir:","options":["los componentes de servicios y otros elementos bajo control de cambios, las categorías de cambio —incluido el cambio de emergencia— y los criterios para identificar cambios con gran impacto potencial en clientes o servicios.","únicamente el comité que aprueba cambios.","todos los cambios que se ejecutarán durante el año.","solo los cambios tecnológicos, no cambios en servicios o SGS."],"correct":0,"explain":"Justificación: A es correcta porque la política de cambios debe definir el alcance del control de cambios, las categorías incluyendo emergencia, y los criterios para cambios de alto impacto potencial. B es incompleta porque un comité puede existir, pero no cubre los elementos exigidos. C es incorrecta porque la política no es un calendario anual de cambios. D es incorrecta porque la gestión de cambios cubre servicios, componentes de servicios y el SGS cuando corresponde, no solo cambios tecnológicos."},{"q":"Al decidir la aprobación y prioridad de una petición de cambio, se deben considerar:","options":["solo la urgencia declarada por el solicitante.","únicamente el coste financiero directo del cambio.","riesgos, beneficios de negocio, viabilidad, impacto financiero y efectos potenciales sobre servicios existentes, clientes, usuarios, políticas, planes, capacidad, disponibilidad, continuidad, seguridad de la información y otras peticiones, entregas o planes de despliegue.","exclusivamente la opinión del proveedor que ejecutará el cambio."],"correct":2,"explain":"Justificación: C es correcta porque la norma exige una evaluación amplia para aprobar y priorizar cambios: riesgos, beneficios, viabilidad, impacto financiero y efectos en servicios, partes interesadas, políticas, planes, capacidad, disponibilidad, continuidad, seguridad y otras peticiones o entregas. A es insuficiente porque la urgencia no sustituye análisis. B es incompleta porque el coste financiero es solo un elemento. D es incorrecta porque la decisión no puede depender exclusivamente del proveedor que ejecuta; deben participar organización y partes interesadas según corresponda."}]; const state = {answers: new Array(q.length).fill(null)}; function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");} function startQuiz(){renderQuiz(); document.getElementById("quiz").style.display="block"; document.getElementById("hero").style.display="none";} function renderQuiz(){const s = document.getElementById("quiz"); s.innerHTML = q.map((qu,i) => "<article class=\"question-card\"><div class=\"q-text\">" + escapeHtml(qu.q) + "</div><div class=\"options\">" + qu.options.map((o,j) => "<label class=\"option\"><input type=\"radio\" name=\"q" + i + "\" value=\"" + j + "\" onchange=\"answerQuestion(" + i + "," + j + ")\"/><span>" + escapeHtml(o) + "</span></label>").join("") + "</div><div class=\"feedback\" id=\"f" + i + "\"></div></article>").join("") + "<div class=\"actions\" style=\"margin-top:24px;justify-content:center;\"><button class=\"btn-primary\" onclick=\"submit()\">Enviar</button><button class=\"btn-secondary\" onclick=\"reset()\">Limpiar</button></div>";} function answerQuestion(i,v){state.answers[i] = v;} function submit(){const u = state.answers.map((v,i) => v === null ? i : null).filter(v => v !== null); if(u.length){alert("Contesta: " + u.map(i => i+1).join(", ")); return;} const user = document.getElementById("username").value.trim() || "Invitado"; const h = q.filter((qu,i) => qu.correct === state.answers[i]).length; const p = Math.round(h/q.length*100); q.forEach((qu,i) => {const se = state.answers[i]; const ok = se === qu.correct; document.querySelector("input[name=\"q" + i + "\"][value=\"" + se + "\"]").parentElement.classList.add(ok ? "correct" : "wrong"); document.querySelector("input[name=\"q" + i + "\"][value=\"" + qu.correct + "\"]").parentElement.classList.add("correct"); const fb = document.getElementById("f" + i); fb.className = "feedback " + (ok ? "ok" : "bad"); fb.innerHTML = "<h4>" + (ok ? "✅" : "❌") + "</h4><p><strong>Tu respuesta:</strong> " + escapeHtml(qu.options[se]) + "</p>" + (ok ? "" : "<p><strong>Correcta:</strong> " + escapeHtml(qu.options[qu.correct]) + "</p>") + (qu.explain ? "<p><strong>Justificación:</strong> " + escapeHtml(qu.explain) + "</p>" : ""); fb.style.display = "block";}); document.querySelector("#quiz .actions").innerHTML = "<button class=\"btn-primary\" onclick=\"showReport()\">Ver informe</button><button class=\"btn-secondary\" onclick=\"reset()\">Reintentar</button>"; state.score = {user, pct: p, hits: h, fails: q.length - h};} function showReport(){document.getElementById("scorePct").textContent = state.score.pct + "%"; document.getElementById("scoreHits").textContent = state.score.hits; document.getElementById("scoreFails").textContent = state.score.fails; document.getElementById("reportUser").textContent = state.score.user; document.getElementById("reportBody").innerHTML = q.map((qu,i) => {const ok = state.answers[i] === qu.correct; return "<tr><td>" + (i+1) + "</td><td>" + escapeHtml(qu.q) + "</td><td>" + escapeHtml(qu.options[state.answers[i]]) + "</td><td>" + escapeHtml(qu.options[qu.correct]) + "</td><td><span class=\"pill " + (ok ? "ok" : "bad") + "\">" + (ok ? "✓" : "✗") + "</span></td></tr>";}).join(""); document.getElementById("quiz").style.display = "none"; document.getElementById("report").style.display = "block";} function reset(){if(confirm("¿Limpiar y volver al inicio?")){state.answers = new Array(q.length).fill(null); document.getElementById("report").style.display = "none"; document.getElementById("quiz").style.display = "none"; document.getElementById("hero").style.display = "block";}}</script></body></html>
