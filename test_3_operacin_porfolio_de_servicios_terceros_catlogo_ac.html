<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISO 20000 · Test 3</title><style>:root{--bg:#0b1020;--panel:#141b34;--text:#eef2ff;--muted:#b9c2e6;--ok:#1db954;--bad:#ff5d73;--accent:#6ea8fe;--accent-2:#9b7bff;--border:#2a3567;}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#0a0f1f,#101733 45%,#0d1430);color:var(--text)}.container{max-width:1100px;margin:0 auto;padding:24px}.hero{background:linear-gradient(135deg,rgba(110,168,254,.18),rgba(155,123,255,.16));border:1px solid var(--border);border-radius:22px;padding:24px}.badges{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 6px}.badge{background:#0f1733;border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:13px}h1{margin:0 0 10px;font-size:34px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.card{background:rgba(20,27,52,.92);border:1px solid var(--border);border-radius:18px;padding:18px}label{display:block;font-weight:700;margin:10px 0 6px}input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#0d1530;color:var(--text)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white}.btn-secondary{background:#202c57;color:var(--text);border:1px solid var(--border)}.quiz-shell{display:none;margin-top:22px}.question-card{background:rgba(20,27,52,.96);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px}.q-text{font-size:20px;font-weight:800;margin:8px 0 14px}.options{display:grid;gap:10px}.option{border:1px solid var(--border);background:#0f1733;border-radius:14px;padding:14px;display:flex;gap:12px;cursor:pointer}.option:hover{border-color:#4b62b0}.option input{margin-top:4px}.option.correct{border-color:rgba(29,185,84,.7);background:rgba(29,185,84,.12)}.option.wrong{border-color:rgba(255,93,115,.7);background:rgba(255,93,115,.12)}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#111936;font-size:13px}.feedback h4{margin:0 0 8px}.feedback p{margin:6px 0}.scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{background:#0f1733;border:1px solid var(--border);border-radius:16px;padding:14px}.metric .value{font-size:28px;font-weight:900}.metric .label{color:var(--muted);font-size:13px}.report{display:none}.report table{width:100%;border-collapse:collapse;font-size:14px}.report th,.report td{border:1px solid var(--border);padding:10px}.report th{background:#121b39}.pill{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.pill.ok{background:rgba(29,185,84,.16);color:#93ffc0}.pill.bad{background:rgba(255,93,115,.14);color:#ffb2bc}@media print{.hero,.card,.question-card{background:white;color:black;border:1px solid #bbb}.btn-primary,.btn-secondary,.actions{display:none}.report{display:block}.quiz-shell{display:none}}</style></head><body><div class="container"><section class="hero" id="hero"><div class="badges"><span class="badge">Test 3/5</span><span class="badge">8 preguntas</span></div><h1>ISO 20000</h1><div class="grid"><div class="card"><h2>Identificación</h2><label for="username">Usuario</label><input id="username" type="text" maxlength="80" placeholder="Nombre / Cargo" /><div class="actions"><button class="btn-primary" onclick="startQuiz()">Comenzar</button><button class="btn-secondary" onclick="window.print()">Imprimir</button></div></div><div class="card"><h3>Info</h3><div><strong>Preguntas:</strong> <span id="qCount">8</span></div></div></div></section><section id="quiz" class="quiz-shell"></section><section id="report" class="report card"><h2>Informe</h2><div class="scorebar"><div class="metric"><div class="value" id="scorePct">0%</div><div class="label">Puntuación</div></div><div class="metric"><div class="value" id="scoreHits">0</div><div class="label">Aciertos</div></div><div class="metric"><div class="value" id="scoreFails">0</div><div class="label">Errores</div></div><div class="metric"><div class="value" id="reportUser">—</div><div class="label">Usuario</div></div></div><table><thead><tr><th>#</th><th>Pregunta</th><th>Tu respuesta</th><th>Correcta</th><th>Resultado</th></tr></thead><tbody id="reportBody"></tbody></table></section></div><script>const q = [{"q":"En la planificación y control operacional, la organización debe:","options":["limitarse a aprobar los procedimientos operativos existentes.","establecer criterios de desempeño para los procesos en función de los requisitos, controlar los procesos conforme a esos criterios y mantener información documentada en la medida necesaria.","documentar todos los pasos de todas las actividades operativas sin excepción.","delegar el control de los procesos externalizados en el proveedor externo."],"correct":1,"explain":"Justificación: B es correcta porque el control operacional exige criterios de desempeño vinculados a requisitos, control de procesos conforme a esos criterios e información documentada suficiente para confiar en que se ejecutan según lo planificado. A es incompleta porque aprobar procedimientos existentes no garantiza control operacional. C es excesiva: la norma no exige documentar absolutamente cada paso, sino en la medida necesaria. D es incorrecta porque los procesos externalizados deben estar controlados por la organización, no simplemente abandonados al proveedor."},{"q":"¿Cuál es la lógica del porfolio de servicios según la norma?","options":["Contener solo los servicios activos incluidos en los SLA vigentes.","Sustituir al catálogo de servicios y a la gestión de configuración.","Gestionar el ciclo de vida completo de los servicios, incluidos propuestos, en desarrollo, activos y servicios a retirar, asegurando una combinación adecuada de servicios.","Registrar únicamente servicios externos prestados a clientes comerciales."],"correct":2,"explain":"Justificación: C es correcta porque el porfolio se usa para gestionar el ciclo de vida completo de los servicios: propuestos, en desarrollo, activos en catálogo y a retirar. A es incompleta porque limita indebidamente el porfolio a servicios activos. B es incorrecta porque el porfolio no sustituye catálogo ni configuración; convive con esas actividades. D es incorrecta porque el porfolio no se limita a servicios externos ni comerciales; depende del alcance del SGS."},{"q":"En planificación de servicios, ¿qué debe hacer la organización?","options":["Documentar requisitos solo para servicios nuevos, no para cambios en servicios existentes.","Determinar y documentar requisitos de servicio para servicios existentes, nuevos y cambios; determinar criticidad; gestionar dependencias y duplicidades; y priorizar cambios o propuestas considerando necesidades de negocio, objetivos y recursos.","Aprobar todos los cambios solicitados por clientes si están recogidos en un SLA.","Determinar la criticidad solo a partir del impacto económico interno."],"correct":1,"explain":"Justificación: B es correcta porque la planificación de servicios exige documentar requisitos para servicios existentes, nuevos y cambios, determinar criticidad, dependencias y duplicidades, proponer cambios cuando sea necesario y priorizar peticiones/propuestas según necesidades de negocio, objetivos y recursos. A es incorrecta porque los cambios y servicios existentes también están cubiertos. C es contraria a la norma: las peticiones deben priorizarse y gestionarse, no aprobarse automáticamente. D es incompleta porque la criticidad considera organización, clientes, usuarios y otras partes interesadas, no solo impacto económico interno."},{"q":"¿Cuál es la afirmación más correcta sobre terceros involucrados en el ciclo de vida de los servicios?","options":["Si un tercero opera el proceso de incidencias, la organización deja de ser responsable de ese proceso.","Los terceros pueden proporcionar u operar todos los servicios, componentes y procesos del alcance si hay contratos firmados.","Solo los proveedores externos se consideran terceros; los proveedores internos y clientes que actúan como proveedores quedan fuera.","La organización mantiene la responsabilidad completa sobre los requisitos de la norma y la prestación de servicios, y los terceros no deben proporcionar u operar todos los servicios, componentes o procesos dentro del alcance del SGS."],"correct":3,"explain":"Justificación: D es correcta porque la organización mantiene la responsabilidad total de los requisitos de la norma y de la prestación, aunque otras partes apoyen el ciclo de vida, y además la norma prohíbe que terceros proporcionen u operen todos los servicios, componentes o procesos dentro del alcance del SGS. A es incorrecta porque delegar actividad no elimina responsabilidad. B es directamente contraria al requisito. C es incorrecta porque la norma considera terceros a proveedores externos, proveedores internos y clientes que actúan como proveedores."},{"q":"¿Qué debe determinar y documentar la organización respecto a terceros?","options":["Servicios, componentes de servicios y procesos o partes de procesos del SGS que son proporcionados u operados por terceros.","Solo el nombre legal del proveedor externo y su número de contrato.","Únicamente las penalizaciones económicas por incumplimiento.","Solo las actividades externalizadas que afecten directamente al cliente final."],"correct":0,"explain":"Justificación: A es correcta porque la norma exige determinar y documentar los servicios, componentes de servicio y procesos o partes de procesos del SGS que son proporcionados u operados por terceros. B es insuficiente: la identificación contractual no explica el control operativo. C es incompleta porque las penalizaciones no sustituyen la determinación de qué se proporciona u opera. D es demasiado estrecha porque también puede haber actividades relevantes que no sean visibles directamente para el cliente final pero afecten al SGS."},{"q":"El catálogo de servicios debe:","options":["contener únicamente los códigos internos de servicio usados por operaciones.","estar disponible completo y sin restricciones para cualquier parte interesada.","describir los servicios, sus resultados esperados y las dependencias entre servicios, dando acceso a las partes apropiadas a clientes, usuarios y otras partes interesadas.","ser sustituido por los SLA, ya que estos identifican servicios y rendimiento acordado."],"correct":2,"explain":"Justificación: C es correcta porque el catálogo debe describir servicios, resultados esperados y dependencias, y dar acceso a las partes apropiadas del catálogo a clientes, usuarios y otras partes interesadas. A es incompleta y demasiado interna. B es incorrecta porque el acceso se da a partes apropiadas y a partes apropiadas del catálogo, no necesariamente a todo y a todos. D es incorrecta porque los SLA no sustituyen al catálogo; ambos son información documentada del SGS con funciones distintas."},{"q":"¿Cuál es el requisito central de gestión de activos?","options":["Todo activo debe ser un elemento de configuración.","Los activos utilizados para prestar servicios deben gestionarse para cumplir los requisitos de servicio y las obligaciones aplicables definidas en el plan.","Solo deben gestionarse activos físicos propiedad de la organización.","La gestión de activos se limita al inventario contable y financiero."],"correct":1,"explain":"Justificación: B es correcta porque los activos utilizados para prestar los servicios deben gestionarse para cumplir los requisitos de servicio y obligaciones aplicables. A es incorrecta porque un activo puede ser CI, pero no todo activo necesariamente lo es ni todo CI es activo. C es incorrecta porque los activos pueden ser tangibles o intangibles y no se limitan a propiedad directa. D es incompleta porque la gestión de activos en el SGS se vincula al cumplimiento de requisitos de servicio, no solo a contabilidad."},{"q":"En gestión de la configuración, ¿cuál de las siguientes combinaciones es correcta?","options":["Se definen tipos de CI, los servicios se clasifican como CI, la información registrada incluye identificación única, tipo, descripción, relación con otros CI y estado; los cambios deben ser trazables y auditables.","Solo se registran componentes técnicos, no servicios.","La información de configuración se verifica únicamente si hay una incidencia grave.","El acceso a la información de configuración debe ser libre para cualquier usuario interno."],"correct":0,"explain":"Justificación: A es correcta porque recoge los requisitos esenciales: definir tipos de CI, clasificar servicios como CI, registrar información mínima relevante, controlar CI, asegurar trazabilidad y auditabilidad de cambios y mantener la integridad de la información de configuración. B es incorrecta porque los servicios se clasifican como CI. C es incorrecta porque la exactitud de la información se verifica a intervalos planificados, no solo ante incidencias graves. D es incorrecta porque el acceso a la información de configuración debe controlarse."}]; const state = {answers: new Array(q.length).fill(null)}; function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");} function startQuiz(){renderQuiz(); document.getElementById("quiz").style.display="block"; document.getElementById("hero").style.display="none";} function renderQuiz(){const s = document.getElementById("quiz"); s.innerHTML = q.map((qu,i) => "<article class=\"question-card\"><div class=\"q-text\">" + escapeHtml(qu.q) + "</div><div class=\"options\">" + qu.options.map((o,j) => "<label class=\"option\"><input type=\"radio\" name=\"q" + i + "\" value=\"" + j + "\" onchange=\"answerQuestion(" + i + "," + j + ")\"/><span>" + escapeHtml(o) + "</span></label>").join("") + "</div><div class=\"feedback\" id=\"f" + i + "\"></div></article>").join("") + "<div class=\"actions\" style=\"margin-top:24px;justify-content:center;\"><button class=\"btn-primary\" onclick=\"submit()\">Enviar</button><button class=\"btn-secondary\" onclick=\"reset()\">Limpiar</button></div>";} function answerQuestion(i,v){state.answers[i] = v;} function submit(){const u = state.answers.map((v,i) => v === null ? i : null).filter(v => v !== null); if(u.length){alert("Contesta: " + u.map(i => i+1).join(", ")); return;} const user = document.getElementById("username").value.trim() || "Invitado"; const h = q.filter((qu,i) => qu.correct === state.answers[i]).length; const p = Math.round(h/q.length*100); q.forEach((qu,i) => {const se = state.answers[i]; const ok = se === qu.correct; document.querySelector("input[name=\"q" + i + "\"][value=\"" + se + "\"]").parentElement.classList.add(ok ? "correct" : "wrong"); document.querySelector("input[name=\"q" + i + "\"][value=\"" + qu.correct + "\"]").parentElement.classList.add("correct"); const fb = document.getElementById("f" + i); fb.className = "feedback " + (ok ? "ok" : "bad"); fb.innerHTML = "<h4>" + (ok ? "✅" : "❌") + "</h4><p><strong>Tu respuesta:</strong> " + escapeHtml(qu.options[se]) + "</p>" + (ok ? "" : "<p><strong>Correcta:</strong> " + escapeHtml(qu.options[qu.correct]) + "</p>") + (qu.explain ? "<p><strong>Justificación:</strong> " + escapeHtml(qu.explain) + "</p>" : ""); fb.style.display = "block";}); document.querySelector("#quiz .actions").innerHTML = "<button class=\"btn-primary\" onclick=\"showReport()\">Ver informe</button><button class=\"btn-secondary\" onclick=\"reset()\">Reintentar</button>"; state.score = {user, pct: p, hits: h, fails: q.length - h};} function showReport(){document.getElementById("scorePct").textContent = state.score.pct + "%"; document.getElementById("scoreHits").textContent = state.score.hits; document.getElementById("scoreFails").textContent = state.score.fails; document.getElementById("reportUser").textContent = state.score.user; document.getElementById("reportBody").innerHTML = q.map((qu,i) => {const ok = state.answers[i] === qu.correct; return "<tr><td>" + (i+1) + "</td><td>" + escapeHtml(qu.q) + "</td><td>" + escapeHtml(qu.options[state.answers[i]]) + "</td><td>" + escapeHtml(qu.options[qu.correct]) + "</td><td><span class=\"pill " + (ok ? "ok" : "bad") + "\">" + (ok ? "✓" : "✗") + "</span></td></tr>";}).join(""); document.getElementById("quiz").style.display = "none"; document.getElementById("report").style.display = "block";} function reset(){if(confirm("¿Limpiar y volver al inicio?")){state.answers = new Array(q.length).fill(null); document.getElementById("report").style.display = "none"; document.getElementById("quiz").style.display = "none"; document.getElementById("hero").style.display = "block";}}</script></body></html>
